<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mental Health Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mental Health Intelligence</p>
          <h1>Mental Health Predictor</h1>
        </div>
      </header>

      <main class="app-grid">
        <section class="panel form-panel">
          <div class="panel-header">
            <h2>Student Profile</h2>
            <span class="status-dot"></span>
          </div>

          <form id="predictForm" novalidate>
            <div class="field-grid">
              <label class="field">
                <span>Age</span>
                <input type="number" id="Age" name="Age" min="10" max="100" required />
              </label>

              <label class="field">
                <span>Gender</span>
                <select id="Gender" name="Gender" required>
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </label>

              <label class="field field-wide">
                <span>Country</span>
                <input type="text" id="Country" name="Country" placeholder="e.g. India" required />
              </label>

              <label class="field">
                <span>Academic Level</span>
                <select id="Academic_Level" name="Academic_Level" required>
                  <option value="">Select</option>
                  <option value="Undergraduate">Undergraduate</option>
                  <option value="Graduate">Graduate</option>
                  <option value="HighSchool">HighSchool</option>
                </select>
              </label>

              <label class="field">
                <span>Most Used Platform</span>
                <select id="Most_Used_Platform" name="Most_Used_Platform" required>
                  <option value="">Select</option>
                  <option value="Facebook">Facebook</option>
                  <option value="LinkedIn">LinkedIn</option>
                  <option value="Instagram">Instagram</option>
                  <option value="Twitter">Twitter</option>
                  <option value="Snapchat">Snapchat</option>
                  <option value="TikTok">TikTok</option>
                  <option value="Reddit">Reddit</option>
                  <option value="YouTube">YouTube</option>
                  <option value="LINE">LINE</option>
                  <option value="WeChat">WeChat</option>
                </select>
              </label>

              <label class="field">
                <span>Purpose of Use</span>
                <select id="Purpose_Of_Use" name="Purpose_Of_Use" required>
                  <option value="">Select</option>
                  <option value="Networking">Networking</option>
                  <option value="Education">Education</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="News">News</option>
                </select>
              </label>

              <label class="field">
                <span>Daily Usage (hours)</span>
                <input type="number" id="Avg_Daily_Usage_Hours" name="Avg_Daily_Usage_Hours" min="0" max="24" step="0.1" required />
              </label>

              <label class="field">
                <span>Daily Unlocks</span>
                <input type="number" id="Daily_Unlocks" name="Daily_Unlocks" min="0" step="1" required />
              </label>

              <label class="field">
                <span>Study Hours</span>
                <input type="number" id="Study_Hours" name="Study_Hours" min="0" max="24" step="0.1" required />
              </label>

              <label class="field">
                <span>Physical Activity (hours)</span>
                <input type="number" id="Physical_Activity_Hours" name="Physical_Activity_Hours" min="0" max="24" step="0.1" required />
              </label>

              <label class="field">
                <span>Sleep (hours/night)</span>
                <input type="number" id="Sleep_Hours_Per_Night" name="Sleep_Hours_Per_Night" min="0" max="24" step="0.1" required />
              </label>

              <label class="field">
                <span>Stress Level</span>
                <select id="Stress_Level" name="Stress_Level" required>
                  <option value="">Select</option>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                  <option value="Very_high">Very High</option>
                </select>
              </label>
            </div>

            <div id="formMessage" class="form-message" aria-live="polite"></div>

            <button type="submit" id="submitBtn" class="primary-btn">
              <span class="btn-label">Predict Score</span>
              <span class="loader hidden" aria-hidden="true"></span>
            </button>
          </form>
        </section>

        <aside class="panel result-panel">
          <div class="score-card">
            <p class="score-label">Predicted Mental Health Score</p>
            <div class="score-wrap">
              <span id="resultValue">--</span>
            </div>
            <p id="resultSummary" class="result-summary">Awaiting student profile...</p>
          </div>
        </aside>
      </main>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
